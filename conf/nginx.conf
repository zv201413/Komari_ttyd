server {
    listen 80;
    server_name _;

    underscores_in_headers on;

    # 真实客户端 IP 的还原规则由 entrypoint.sh 按部署方式生成：
    #   走 Cloudflare Tunnel（设了 TUNNEL_TOKEN）→ 信任 127.0.0.1，读 CF-Connecting-IP
    #   走平台 LB（Northflank 等）           → 信任私有网段，读 X-Forwarded-For
    # 可用 REAL_IP_HEADER / TRUSTED_PROXY_CIDR 两个环境变量覆盖。
    include /etc/nginx/realip.inc;

    client_max_body_size 10m;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:25774;
    }
}
