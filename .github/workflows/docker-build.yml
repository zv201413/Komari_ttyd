name: Build and Push Docker Image

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [upstream-updated]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v2.1.0）。填写后会打成永久版本标签并同时更新 latest；留空则只覆盖 latest。"
        required: false
        type: string

# 自动构建（push / 上游 dispatch）归入同一并发组并取消进行中的旧构建，
# 避免连续推送触发多次重复构建；手动构建各自独立分组，永不被取消，
# 以免正在打永久版本标签的构建被打断。
concurrency:
  group: docker-build-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  IMAGE_NAME: komari-ttyd
  REGISTRY: ghcr.io
  LOWERCASE_REPO: ${{ github.repository_owner }}/komari_ttyd

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Clone and build frontend
        run: |
          git clone --depth 1 -b radix https://github.com/zv201413/komari-web_new.git web
          cd web
          npm install
          npm run build

      - name: Clone backend
        run: |
          git clone --depth 1 -b main https://github.com/zv201413/komari_new.git komari
          mkdir -p komari/public/defaultTheme/dist
          cp -r web/dist/* komari/public/defaultTheme/dist/
          cp -f web/komari-theme.json komari/public/defaultTheme/
          if [ -f web/preview.png ]; then cp -f web/preview.png komari/public/defaultTheme/; fi
          if [ -f web/perview.png ]; then cp -f web/perview.png komari/public/defaultTheme/; fi
          if [ -f komari/public/defaultTheme/preview.png ] && [ ! -f komari/public/defaultTheme/perview.png ]; then cp -f komari/public/defaultTheme/preview.png komari/public/defaultTheme/perview.png; fi
          if [ -f komari/public/defaultTheme/perview.png ] && [ ! -f komari/public/defaultTheme/preview.png ]; then cp -f komari/public/defaultTheme/perview.png komari/public/defaultTheme/preview.png; fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Zig
        run: |
          wget https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          sudo tar -C /usr/local -Jxf zig-x86_64-linux-0.14.1.tar.xz
          echo "PATH=$PATH:/usr/local/zig-x86_64-linux-0.14.1" >> $GITHUB_ENV

      - name: Resolve version and image tags
        id: meta
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}"
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            # 手动构建并填写了版本号：打永久版本标签，同时更新 latest
            VERSION="$INPUT_VER"
          else
            # 自动构建（push / 上游 dispatch）或手动未填版本：只覆盖 latest 滚动标签
            VERSION="snapshot-$(date -u +%Y%m%d)-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "$REPO:latest"
            [ -n "$INPUT_VER" ] && echo "$REPO:$INPUT_VER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=$VERSION"

      - name: Build static binaries for multi-arch
        env:
          CGO_ENABLED: 1
          GIN_MODE: release
        run: |
          cd komari
          VERSION="${{ steps.meta.outputs.version }}"
          VERSION_HASH="${{ github.sha }}"
          LDFLAGS="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${VERSION_HASH}"

          echo "Building for linux/amd64..."
          GOOS=linux GOARCH=amd64 CC="zig cc -target x86_64-linux-musl" go build -trimpath -ldflags="$LDFLAGS" -o ../komari-linux-amd64

          echo "Building for linux/arm64..."
          GOOS=linux GOARCH=arm64 CC="zig cc -target aarch64-linux-musl" go build -trimpath -ldflags="$LDFLAGS" -o ../komari-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
